name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@23139a663b090be91f54115baa805f4588255aa5 # main
    # dist/ is committed (upstream's popper.js@1.16.1 build output, checked
    # byte-for-byte by test/dist-integrity.test.js), so the token-holding job
    # needs no install and no build.
    secrets: inherit
