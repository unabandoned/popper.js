name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@6dfdb74cc9719e92442a28d45a3f86c855cc75cc # main
    # dist/ is committed (upstream's popper.js@1.16.1 build output, checked
    # byte-for-byte by test/dist-integrity.test.js), so the token-holding job
    # needs no install and no build.
    secrets: inherit
