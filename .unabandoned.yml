schema: 1

package: "@unabandoned/popper.js"

upstream:
  repo: floating-ui/floating-ui
  reason: "the v1 line (branch v1.x) has not released since 1.16.1 in 2020, and npm marks popper.js deprecated in favour of @popperjs/core v2"

summary: >-
  Popper.js v1: the positioning engine that places tooltips, popovers and
  dropdowns next to their reference element, shipped as prebuilt UMD and ES
  module bundles with zero runtime dependencies.

why-forked: >-
  CyberChef runs Bootstrap 4.6 with bootstrap-material-design 4, and Bootstrap 4
  requires popper.js v1 as a peer; @unabandoned/bootstrap-colorpicker declares
  it as an optional peer too. v2 (@popperjs/core) is a different API, so it is
  not a replacement. The upstream package is deprecated, so every consumer's
  dependency dashboard flags it; the fork gives v1 an owned, non-deprecated
  name, and ships upstream's 1.16.1 dist byte-for-byte so the alias is a true
  drop-in.

used-by:
  - consumer: TheTechNetwork/CyberChef
    purpose: >-
      the peer Bootstrap 4's dropdowns, tooltips and popovers position with;
      webpack also loads popper.js/dist/umd/popper.js directly
  - consumer: unabandoned/bootstrap-colorpicker
    purpose: >-
      optional peer that positions the colour picker as a popover

status: active

tags: [ui, positioning, tooltip, popover, bootstrap]
